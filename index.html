<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Student Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <h2>Welcome Students</h2>
        
        <div class="fb">
            <section id="ps">
                <div class="input-group">
                    <label for="date">Date :</label>
                    <input type="datetime-local" id="date" />
                </div>
                <div class="input-group">
                    <label for="name">Full Name :</label>
                    <input type="text" id="name"required  placeholder="Ener Your Full Name" />
                </div>
                <div class="input-group">
                    <label for="pp">Profile Picture :</label>
                    <input type="file" id="pp" />
                </div>
                <div class="input-group">
                    <label for="fn">Father Name :</label>
                    <input type="text" id="fn"reqired placeholder="Enter Father Name" />
                </div>
                <div class="input-group">
                    <label for="mn">Mother Name :</label>
                    <input type="text" id="mn"required placeholder="Enter Mother Name" />
                </div>
            </section>

            <section id="as">
                <div class="input-group">
                    <label for="class">Class/Branch :</label>
                    <input type="text" id="class"placeholder="e.g. 10th / C.S.E." required />
                </div>
                <div class="input-group">
                    <label for="enrl">Enrollment no :</label>
                    <input type="text" id="enrl"placeholder="E2444..." required />
                </div>
                <div class="input-group">
                    <label for="adrs">Address :</label>
                    <input type="text" id="adrs"placeholder="Eneter Full Address" required />
                </div>
                <div class="input-group">
                    <label for="Contact">Contact No:</label>
                    <input type="tel" id="Contact"placeholder="+91" required />
                </div>
                <div class="input-group">
                    <label for="email">G-mail :</label>
                    <input type="email" id="email"placeholder="example@gmail.com"/>
                </div>
            </section>
        </div>

        <button type="submit" id="btn">Submit</button>
    </form>
   <script src="script.js"></script>
</body>
</html>
